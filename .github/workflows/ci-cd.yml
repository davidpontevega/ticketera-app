name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

env:
  AWS_REGION: us-east-2
  REGISTRY: 282380327294.dkr.ecr.us-east-2.amazonaws.com
  INSTANCE_ID: i-00ce0f77d2499eb0c
  SITE_URL: https://d1byedkkizcev7.cloudfront.net

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run

  deploy:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: aws ecr get-login-password | docker login --username AWS --password-stdin $REGISTRY
      - name: Build y push
        run: |
          param() { aws ssm get-parameter --name "/ticketera/$1" --query Parameter.Value --output text; }
          docker build -t $REGISTRY/ticketera:$GITHUB_SHA \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$(param NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY)" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_URL="$(param NEXT_PUBLIC_CLERK_SIGN_IN_URL)" \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_URL="$(param NEXT_PUBLIC_CLERK_SIGN_UP_URL)" \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$(param NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY)" .
          docker build --target migrate -t $REGISTRY/ticketera:$GITHUB_SHA-migrate .
          docker push $REGISTRY/ticketera:$GITHUB_SHA
          docker push $REGISTRY/ticketera:$GITHUB_SHA-migrate
      - name: Deploy (SSM Run Command)
        run: |
          B64=$(base64 -w0 deploy/deploy.sh)
          ID=$(aws ssm send-command --instance-ids $INSTANCE_ID --document-name AWS-RunShellScript \
            --parameters "commands=[\"echo $B64 | base64 -d | bash -s $GITHUB_SHA\"]" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id $ID --instance-id $INSTANCE_ID || true
          aws ssm get-command-invocation --command-id $ID --instance-id $INSTANCE_ID \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          test "$(aws ssm get-command-invocation --command-id $ID --instance-id $INSTANCE_ID --query Status --output text)" = Success
      - name: Verificar
        run: curl -fsS --retry 5 --retry-delay 5 $SITE_URL/api/health
